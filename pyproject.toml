[project]
name = "ml-structural-system-paper"
version = "1.0.0"
description = "Data and code to reproduce the paper 'Estimating building structural systems from footprints: transferability of machine learning models across three Latin American cities'."
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.12"
# The method itself is the ml_structural_system package. Everything else is
# pinned to the versions used for the paper: even patch releases of
# scikit-learn, XGBoost or CatBoost can shift the reported scores slightly.
dependencies = [
    "ml-structural-system",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "scikit-learn==1.9.0",
    "imbalanced-learn==0.14.2",
    "xgboost==3.3.0",
    "catboost==1.2.10",
    "mlflow==3.14.0",
    "joblib==1.5.3",
    "pyyaml==6.0.3",
    "geopandas==1.1.4",
    "tqdm==4.66.5",
    "shap==0.52.0",
    "matplotlib==3.11.0",
]

[dependency-groups]
# For running paper_results.ipynb locally (Google Colab already has them).
notebook = ["folium>=0.17", "ipywidgets>=8.1", "ipykernel>=6.29"]

[tool.uv]
package = false
# The footprint_attributes commit used for the paper (Figure 2 uses its API).
override-dependencies = [
    "footprint-attributes @ git+https://github.com/GeomaticsCaminosUPM/footprint_attributes@6b85854823e73b123977a70fdb50c32002c22005",
]

[tool.uv.sources]
ml-structural-system = { path = "../../../code/ml_structural_system", editable = true }
