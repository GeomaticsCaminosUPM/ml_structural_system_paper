extends: ../main.yaml

models:
  enabled:
    - LogisticRegression
    - RandomForest
    - XGBoost
    - CatBoost
    - HistGradientBoosting

cost_matrix:
  label_encoding:
    CR: 0
    M: 1
    W: 2

preprocessing:
  id_col: block_id
  data:
    train_source:
      - ../../data/san_jose/mata_redonda.gpkg
    test_source:
      - ../../data/san_jose/esquivel.gpkg
