extends: ../main.yaml

models:
  enabled:
    - LogisticRegression
    - RandomForest
    - XGBoost
    - CatBoost
    - HistGradientBoosting

cost_matrix:
  label_encoding:
    CR: 0
    M: 1

preprocessing:
  min_class_fraction: 0.05

  min_class_size_per_split: 3

  id_col: block_id
  data:
    train_source:
      - ../../data/guatemala/zona1.gpkg
    test_source:
      - ../../data/guatemala/zona10.gpkg
