extends: ../main.yaml

models:
  enabled:
    - LogisticRegression
    - RandomForest
    - XGBoost
    - CatBoost
    - HistGradientBoosting

cost_matrix:
  label_encoding:
    ADO: 0
    CR: 1
    M: 2
    S: 3

preprocessing:
  id_col: block_id
  data:
    train_source:
      - ../../data/guatemala/zona10.gpkg
      - ../../data/guatemala/zona1.gpkg
      - ../../data/santo_domingo/santo_domingo_center.gpkg
      - ../../data/santo_domingo/ensanche_quisquella.gpkg
    test_source:
      - ../../data/san_jose/san_jose_sample.gpkg
      - ../../data/san_jose/mata_redonda.gpkg
